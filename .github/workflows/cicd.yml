# CI/CD for the Colombian football medallion pipeline.
#
# pull_request / push to develop: unit tests (pytest on a local Spark) and
#   databricks bundle validate for both targets.
# push to main: deploy the prod target (football_col_prod catalog).
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DATABRICKS_HOST  - e.g. https://dbc-d390eebe-258b.cloud.databricks.com
#   DATABRICKS_TOKEN - a Databricks PAT with rights on the catalogs

name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "pytest~=8.3.5" "pyspark~=3.5"

      - name: Run tests
        run: pytest tests -v

  bundle-validate:
    name: Bundle validate (dev + prod)
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: Validate dev target
        run: databricks bundle validate --target dev

      - name: Validate prod target
        run: databricks bundle validate --target prod

  deploy-prod:
    name: Deploy prod target
    runs-on: ubuntu-latest
    needs: bundle-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: Deploy to football_col_prod
        run: databricks bundle deploy --target prod
