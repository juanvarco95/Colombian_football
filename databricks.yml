# Databricks Asset Bundle for the Colombian football medallion pipeline.
# Docs: https://docs.databricks.com/dev-tools/bundles/
#
#   databricks bundle validate --target dev    # check config (dev)
#   databricks bundle deploy --target dev      # deploy dev resources
#   databricks bundle run football_pipeline --target dev
#   databricks bundle validate --target prod   # check config (prod)
#   databricks bundle deploy --target prod     # what CI runs on main
#
# Architecture: the pipeline (bronze/silver/gold + views) is defined as a
# bundle resource reading its catalog from ${var.catalog} — dev deploys to
# football_col_dev, prod to football_col_prod. The job lands new raw
# API-Football files via the Landing notebook, then triggers a pipeline
# update that reprocesses them end to end.

bundle:
  name: colombian_football

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog the medallion pipeline publishes to
    default: football_col_dev

targets:
  dev:
    # Development mode: resources are prefixed with "[dev <user>]",
    # job schedules are paused, and files deploy under your user folder.
    mode: development
    default: true
    variables:
      catalog: football_col_dev
    workspace:
      host: https://dbc-d390eebe-258b.cloud.databricks.com

  prod:
    # Production mode: stable names, deploys the football_col_prod catalog.
    mode: production
    variables:
      catalog: football_col_prod
    workspace:
      host: https://dbc-d390eebe-258b.cloud.databricks.com
      # Production deploys must have one explicit root (single copy).
      root_path: /Workspace/Users/juanvarco95@gmail.com/.bundle/colombian_football/prod
